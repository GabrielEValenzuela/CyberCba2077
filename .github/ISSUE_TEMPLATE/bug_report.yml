name: "Bug Report"
description: "Report a defect, regression, or unexpected behavior in CyberCBA 2077"
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        New to the project? Skim [`AGENTS.md`](../../AGENTS.md) and
        [`docs/TAD-001.md`](../../docs/TAD-001.md) first — they explain the
        architecture and constraints this project follows, which helps a
        lot when describing where something broke.

        A good bug report should explain:
        - what happened
        - what you expected to happen
        - how to reproduce it
        - what part of the system is affected

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the primary area affected by the bug.
      options:
        - core (state machine, combat, missions, progression)
        - structures (DynamicArray/Queue/Stack/DirectedGraph)
        - platform (raylib adapters — input/asset/audio/render)
        - app (composition root / main loop)
        - build (CMake, vcpkg)
        - ci
        - docs
        - tests
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this bug?
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: input
    id: branch_commit
    attributes:
      label: Branch / Commit
      description: Provide the branch name or commit SHA where the issue was observed.
      placeholder: "feature/mission-1-content or a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the bug in 2-5 lines.
      placeholder: "CombatSystem::resolveAction lets Emma use Maneuver, which should be Magga-exclusive."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a clear, minimal, reproducible scenario. If it's covered by a failing test, paste the test name/output instead of manual steps.
      placeholder: |
        1. Build the project (cmake --preset dev && cmake --build build/dev)
        2. Run ctest --test-dir build/dev
        3. Observe CombatSystemTest.ManeuverIsMaggaOnly failing
        (or, for manual repro: exact input sequence in the running app)
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened? Cite the doc/spec section if there's a documented rule (GPD/TAD-001/VS-001).
      placeholder: "isActionAvailable should return false for Maneuver when character == Emma (VS-001 §7.2)."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: "isActionAvailable returns true for any character."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, stack traces, sanitizer output, or console/ctest output if available.
      placeholder: |
        Paste error logs here.
        Example:
        AddressSanitizer: heap-use-after-free ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe the environment where the issue occurs.
      placeholder: |
        OS: Ubuntu 24.04
        Compiler: clang++ 18
        CMake preset: dev
        VCPKG_ROOT set: yes
    validations:
      required: true

  - type: textarea
    id: scope_impact
    attributes:
      label: Scope / impact
      description: What modules, systems, or player-facing flows appear to be affected?
      placeholder: "Affects tactical combat action legality for both protagonists."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Reporter checklist
      description: Confirm the following before submitting.
      options:
        - label: I searched for existing issues and did not find a duplicate.
          required: true
        - label: I included reproducible steps (or a failing test name).
          required: true
        - label: I described expected and actual behavior.
          required: true
        - label: I attached logs, screenshots, or evidence when available.
          required: false
