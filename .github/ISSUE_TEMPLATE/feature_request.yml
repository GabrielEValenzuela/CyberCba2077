name: "Feature Request"
description: "Propose a new feature, system, or content addition for CyberCBA 2077"
title: "[FEATURE] "
labels: ["feature", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature.

        Before writing this up: check [`docs/GPD.md`](../../docs/GPD.md)
        (product/narrative rules) and [`docs/TAD-001.md`](../../docs/TAD-001.md)
        (architecture rules) — a lot of "what if we added X" questions are
        already answered there (see especially GPD §2 and §72, "No objetivos").
        If your idea conflicts with something documented there, say so
        explicitly instead of routing around it silently.

        A strong feature request should explain:
        - the problem or need
        - the proposed outcome
        - why it matters
        - how success will be validated

  - type: dropdown
    id: area
    attributes:
      label: Target area
      description: Select the primary area where this feature belongs.
      options:
        - core (state machine, combat, missions, progression)
        - structures (DynamicArray/Queue/Stack/DirectedGraph)
        - platform (raylib adapters — input/asset/audio/render)
        - app (composition root / main loop)
        - narrative content (VS-001 scenes/dialogue)
        - build (CMake, vcpkg)
        - ci
        - docs
        - tests
        - other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: Initial prioritization proposal.
      options:
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What problem are we trying to solve, or what opportunity are we trying to unlock?
      placeholder: |
        MissionSystem currently only tracks scene type (Dialogue/Puzzle/Combat)
        but has no way to represent the first Act I mission's scene sequence.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed feature clearly and concretely.
      placeholder: |
        Add MissionDefinition/SceneDefinition data for Mission 1 ("Rastro Frío")
        per VS-001 §5, and wire it into Game so it's selectable from CentralMap.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Expected value
      description: Why is this feature useful for the project, team, or player experience?
      placeholder: |
        This is the next milestone called out in AGENTS.md / CHANGELOG.md's
        "Known limitations" — needed before the Vertical Slice is playable
        end-to-end.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Define the concrete criteria that must be met for this feature to be considered done. Reference VS-001/TAD-001 sections when applicable.
      placeholder: |
        - Mission 1 scenes (M1-M4, VS-001 §5) are authored as SceneDefinition data
        - MissionSystem can run the full sequence without crashing
        - Unit tests cover the new scene data's branching (M1 persuasion routes)
        - No new STL containers / smart pointers introduced (TAD-001 §10-§11)
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical considerations
      description: Mention architecture, modules, contracts, constraints, or dependencies that should be considered.
      placeholder: |
        Reuse MissionSystem's existing Dialogue/Puzzle/Combat scene model —
        don't add a parallel mechanism. Puzzle scenes still can't run end-to-end
        until DynamicArray/Queue/Stack/DirectedGraph are implemented (see
        AGENTS.md "Current implementation state").
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / trade-offs
      description: What could be impacted or complicated by this change?
      placeholder: |
        Risk of hardcoding narrative content in a way that's hard to extend
        for Mission 2/3 later — check VS-001 §21 (data-driven policy) first.
    validations:
      required: false

  - type: textarea
    id: evidence_mockups
    attributes:
      label: Mockups / examples / references
      description: Optional. Add sketches, screenshots, dialogue examples, or references.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Requester checklist
      description: Confirm the following before submitting.
      options:
        - label: I searched for existing issues and did not find a duplicate.
          required: true
        - label: I checked docs/GPD.md and docs/TAD-001.md for conflicts with this proposal.
          required: true
        - label: I described the problem, not only the solution.
          required: true
        - label: I included measurable acceptance criteria.
          required: true
