name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  # Pinned to the exact commit vcpkg.json's builtin-baseline points at
  # (TAD-001 §35: dependencies fixed to an exact tag/commit, never latest).
  VCPKG_COMMIT: d034cf165b78579b6d526cf440d2781940e9074b
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # glfw3 (a transitive dependency of the vcpkg raylib port) builds from
  # source on Linux and needs system X11/Wayland dev headers present; our own
  # CMakeLists.txt also find_package(X11 REQUIRED) directly (see
  # src/platform/raylib/CMakeLists.txt).
  LINUX_WINDOWING_APT_DEPS: >-
    libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev
    libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find include src tests -name "*.hpp" -o -name "*.cpp" | \
            xargs clang-format --dry-run --Werror

  forbidden-symbols-audit:
    name: forbidden-symbols-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for banned STL containers / smart pointers (TAD-001 §63)
        run: |
          PATTERN='std::(vector|array|list|forward_list|deque|queue|stack|map|unordered_map|set|unordered_set|unique_ptr|shared_ptr|weak_ptr)\b'
          # Excludes whole-line comments so documentation that names the ban
          # itself (e.g. "no STL containers (no adjacency list built on
          # std::vector)") doesn't trip the audit.
          if grep -rEn "$PATTERN" include src | grep -vE ':[0-9]+: *//'; then
            echo "::error::Forbidden STL container or smart pointer found (see TAD-001 §10-§11, §63)."
            exit 1
          fi

  clang-build:
    name: clang-build
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang $LINUX_WINDOWING_APT_DEPS
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: clang-build
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang $LINUX_WINDOWING_APT_DEPS
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Run tests
        run: ctest --preset ci

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy $LINUX_WINDOWING_APT_DEPS
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure with clang-tidy enabled
        run: cmake --preset ci -DCYBERCBA_ENABLE_CLANG_TIDY=ON
      - name: Build (runs clang-tidy on first-party targets only)
        run: cmake --build --preset ci

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang $LINUX_WINDOWING_APT_DEPS
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Run tests under ASan+UBSan
        run: ctest --preset asan

  doxygen:
    name: doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build docs and check for undocumented public API
        run: |
          doxygen Doxyfile 2> doxygen-warnings.log
          cat doxygen-warnings.log
          if grep -q "not documented" doxygen-warnings.log; then
            echo "::error::Doxygen found undocumented public members (see doxygen-warnings.log above)."
            exit 1
          fi

  portability:
    name: portability
    runs-on: windows-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure (MSVC)
        run: cmake -S . -B build/portability --toolchain "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DCYBERCBA_BUILD_APP=OFF -DCYBERCBA_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build/portability
